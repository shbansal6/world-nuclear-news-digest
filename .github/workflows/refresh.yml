name: Refresh and publish nuclear digest
on:
  # Avoid running the full ingest/deploy workflow for every code push.
  # Vercel handles website deployment independently on Git pushes.
  workflow_dispatch:
  schedule:
    # 7 AM America/Chicago = 12 UTC summer, 13 UTC winter.
    # The Python script ignores the other DST cron run.
    - cron: '0 12 * * 1'
    - cron: '0 13 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nuclear-digest-publishing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source reader
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Validate interactive website script before publishing
        run: node --check app.js
      - name: Check Python collector syntax
        run: python -m py_compile scripts/refresh.py scripts/taxonomy.py scripts/sources.py scripts/comprehensive_sources.py scripts/dedupe.py scripts/test_dedupe.py scripts/test_sources.py scripts/test_comprehensive.py scripts/audit.py
      - name: Test duplicate-news classification before refreshing
        run: python scripts/test_dedupe.py
      - name: Test NCEA research topic and publication date validation
        run: python scripts/test_sources.py
      - name: Test comprehensive publisher collection and deduplication
        run: python scripts/test_comprehensive.py
      - name: Refresh nuclear news, reports and weekly briefings
        run: python scripts/refresh.py
      - name: Validate historical archive and critical PPAs
        run: python scripts/audit.py
      - name: Test rendered homepage and global searches
        run: node scripts/smoke.js
      - name: Commit source-linked data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/briefings.json data/source_records.json data/source_cursors.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh unified nuclear research archive"
            git push
          fi
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
